# Required for any AndroidX-based module (wearos-app uses AndroidX/Compose throughout).
android.useAndroidX=true

# More heap for the Gradle daemon and Kotlin/dex compiler workers. The default was too small
# and caused an OutOfMemoryError during dex merging on the first real build of this project.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.parallel=true
